name: buoi6
description: "Bài tập Flutter - Bài 4 đến Bài 7"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Packages cho Bài 4 -> 7
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  video_player: ^2.8.6
  flutter_contacts: ^1.1.9+1
  audioplayers: ^6.0.0
  flutter_sms_inbox: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audios/